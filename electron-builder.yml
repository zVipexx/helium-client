appId: com.zvipexx.helium
productName: Helium Client
directories:
  output: "build"
npmRebuild: false
win:
  executableName: HeliumClientKirka
  target:
    - target: nsis
  icon: "src/assets/img/icon.png"
  artifactName: "${name}-setup-win-${version}.${ext}"
mac:
  target: dmg
  icon: "src/assets/img/icon.icns"
  artifactName: "${name}-setup-mac-${version}.${ext}"
linux:
  target:
    - AppImage
    - tar.gz
  category: Game
  icon: "src/assets/img/icon.png"
  artifactName: "${name}-${version}-linux-${arch}.${ext}"
publish:
  - provider: github
    owner: zVipexx
    repo: helium-client
    releaseType: release